app = 'cyber-sim-bsdk'
primary_region = 'arn'

# Top-level autoscaling keys (must NOT be nested under [[services]] — Fly silently ignores them there).
# Crucial to prevent fly from autostopping the machine, since bot traffic isn't seen as inbound HTTP by the proxy.
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1

[build]

# Note: We do NOT use [http_service].
# [http_service] automatically binds to public IPs (port 80 and 443).
# We want this app to be completely private, accessible only via 6PN
# at http://cyber-sim-bsdk.internal:8080

[[services]]
  internal_port = 8080
  protocol = "tcp"
  # OMITTING [[services.ports]] ensures it is NOT exposed to the public internet.

  [services.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  # Probe /api/status (defined in launcher.js). If it stops answering, Fly
  # restarts the machine — without this, a wedged launcher silently breaks
  # all bot-spawn requests until someone notices.
  [[services.http_checks]]
    interval     = '30s'
    timeout      = '5s'
    grace_period = '10s'
    method       = 'get'
    path         = '/api/status'
    protocol     = 'http'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
