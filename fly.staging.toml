app = 'cyber-sim-sdk-staging'
primary_region = 'arn'

auto_stop_machines = false 
auto_start_machines = false
min_machines_running = 0

[build]

[deploy]
  strategy = "immediate"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  # No [[services.ports]] — never exposed to the public internet.

  [services.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[services.http_checks]]
    interval     = '30s'
    timeout      = '5s'
    grace_period = '10s'
    method       = 'get'
    path         = '/api/status'
    protocol     = 'http'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
